name: compliance-mcp-ci

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read          # moindre privilège pour le GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, tests, SBOM
        run: mvn -B verify

      - name: Archive SBOM (preuve NIS2 / CRA)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/bom.*

      - name: Dependency review (PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, SSPL-1.0
