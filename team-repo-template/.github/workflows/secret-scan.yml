name: secret-scan

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read          # moindre privilège

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tout l'historique : un secret retiré du code reste dans les anciens commits
      # Filet de sécurité : le hook local se contourne (git commit --no-verify), la CI non.
      # CLI officielle plutôt que gitleaks-action (licence requise pour les comptes Organisation).
      - name: Gitleaks 8.30.1 (binaire vérifié)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml .
