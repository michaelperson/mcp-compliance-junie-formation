# Détection de secrets : règles par défaut de gitleaks + règles propres à l'équipe.
# Testé avec gitleaks 8.30.1 (syntaxe [[allowlists]] : gitleaks >= 8.25 requis).
title = "bstorm — détection de secrets (NIS2 art. 21, CRA annexe I)"

[extend]
useDefault = true

[[rules]]
id = "compliance-mcp-api-key"
description = "Clé API du compliance-mcp-server (en-tête X-API-Key ou variable COMPLIANCE_MCP_API_KEY)"
regex = '''(?i)(?:x-api-key|compliance_mcp_api_key)["']?\s*[:=]\s*["']?([0-9a-f]{32,})'''
secretGroup = 1
keywords = ["x-api-key", "compliance_mcp_api_key"]

[[rules]]
id = "hardcoded-password"
description = "Mot de passe codé en dur (Java, TypeScript, YAML, properties)"
regex = '''(?i)(?:password|passwd|pwd)[a-z_]*["']?\s*[:=]\s*["']([^"'\s$]{8,})["']'''
secretGroup = 1
keywords = ["password", "passwd", "pwd"]

# Exceptions explicites et justifiées (à revoir à chaque ajout : une exception est une dette)
[[allowlists]]
description = "Exemples sans secret et pièges pédagogiques volontaires"
paths = [
  '''\.junie[/\\]mcp[/\\]mcp\.json\.example''',
  '''demo-traps[/\\]''',
  '''\.gitleaks\.toml''',
]
